<template>
    <lightning-card>
        <div class="slds-p-around_medium plaid-wrapper">

            <!-- Loading -->
            <template if:true={isLoading}>
                <div class="loading-container">
                    <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>

                <!-- ── Header ──────────────────────────────── -->
                <div class="page-header">
                    <div class="header-left">
                        <div class="header-icon">🏦</div>
                        <div>
                            <p class="header-label">Total Portfolio Balance</p>
                            <template if:true={isConnected}>
                                <h2 class="header-total">{grandTotal}</h2>
                                <p class="header-sub">{totalAccountCount} account(s) · {connections.length} bank(s)</p>
                            </template>
                            <template if:false={isConnected}>
                                <h2 class="header-total">$0.00</h2>
                                <p class="header-sub">No banks linked yet</p>
                            </template>
                        </div>
                    </div>
                    <button class="header-add-btn" onclick={handleConnectBank}>
                        + {connectButtonLabel}
                    </button>
                </div>

                <!-- ── Error ───────────────────────────────── -->
                <template if:true={error}>
                    <div class="error-banner" role="alert">
                        <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                        <span>{error}</span>
                        <button class="error-close" onclick={clearError}>✕</button>
                    </div>
                </template>

                <!-- ── Empty State ─────────────────────────── -->
                <template if:false={isConnected}>
                    <div class="empty-state">
                        <div class="empty-icon">💳</div>
                        <h2 class="empty-title">No Bank Accounts Connected</h2>
                        <p class="empty-desc">
                            Securely link your bank to view real-time balances — right inside Salesforce.
                        </p>
                        <button class="empty-btn" onclick={handleConnectBank}>
                            Connect Your First Bank
                        </button>
                    </div>
                </template>

                <!-- ── Bank Cards ──────────────────────────── -->
                <template for:each={connections} for:item="connection">
                    <div key={connection.groupKey} class="bank-card">

                        <!-- ── Bank Header ─────────────────── -->
                        <div class={connection.headerClass} data-group-key={connection.groupKey} onclick={handleToggle}>

                            <div class="bank-avatar" style={connection.avatarStyle}>
                                {connection.institutionInitial}
                            </div>
                            <div class="bank-info">
                                <h3 class="bank-name">{connection.institutionName}</h3>
                                <p class="bank-count">{connection.accountCount} Account(s)</p>
                            </div>

                            <div class="bank-actions">
                                <template if:false={connection.confirmingBankRemove}>
                                    <button class="bank-remove-btn" data-group-key={connection.groupKey}
                                        onclick={handleBankRemoveClick} title="Remove all accounts for this bank">
                                        Remove Bank
                                    </button>
                                </template>
                                <template if:true={connection.confirmingBankRemove}>
                                    <div class="bank-confirm-row">
                                        <span class="confirm-label">Remove all?</span>
                                        <button class="confirm-yes" data-group-key={connection.groupKey}
                                            onclick={handleBankConfirmRemove}>✓</button>
                                        <button class="confirm-no" data-group-key={connection.groupKey}
                                            onclick={handleBankCancelRemove}>✕</button>
                                    </div>
                                </template>
                            </div>

                            <div class={connection.chevronClass}>
                                <lightning-icon icon-name="utility:chevrondown" size="x-small" variant="bare">
                                </lightning-icon>
                            </div>

                        </div>

                        <!-- ── Account Rows ────────────────── -->
                        <div class={connection.accountsWrapClass}>
                            <template for:each={connection.accounts} for:item="account">
                                <div key={account.accountId} class="account-row">

                                    <div class="acct-icon" style={account.iconStyle}>
                                        <lightning-icon icon-name={account.iconName} size="x-small" variant="inverse">
                                        </lightning-icon>
                                    </div>

                                    <div class="acct-info">
                                        <span class="acct-name">{account.name}</span>
                                        <template if:true={account.officialName}>
                                            <span class="acct-official">{account.officialName}</span>
                                        </template>
                                        <div class="acct-meta">
                                            <span class="acct-mask">••••{account.mask}</span>
                                            <span class={account.chipClass}>{account.subtype}</span>
                                        </div>
                                        <div class="acct-token-row">
                                            <span class="acct-token-label">Account ID:</span>
                                            <span class="acct-token-value">{account.accountId}</span>
                                        </div>
                                        <div class="acct-token-row">
                                            <span class="acct-token-label">Access Token:</span>
                                            <span class="acct-token-value">{account.accessToken}</span>
                                        </div>
                                    </div>

                                    <div class="acct-right">
                                        <div class="acct-balance">
                                            <span class="bal-current">{account.formattedCurrentBalance}</span>
                                            <span class="bal-available">Avail: {account.formattedAvailableBalance}</span>
                                        </div>

                                        <button class="get-account-btn" data-group-key={connection.groupKey}
                                            data-account-id={account.accountId} onclick={handleGetAccount}>
                                            Get Account
                                        </button>

                                        <button class="get-identity-btn" data-group-key={connection.groupKey}
                                            data-account-id={account.accountId}
                                            data-connection-id={account.connectionId} onclick={handleGetIdentity}>
                                            <template if:true={isLoadingIdentity}>...</template>
                                            <template if:false={isLoadingIdentity}>Get Identity</template>
                                        </button>

                                        <button class="send-transfer-btn" data-group-key={connection.groupKey}
                                            data-account-id={account.accountId}
                                            data-connection-id={account.connectionId} onclick={handleSendTransfer}
                                            title="Send ACH transfer from this account">
                                            Send Transfer
                                        </button>

                                        <button class="send-rt-transfer-btn" data-group-key={connection.groupKey}
                                            data-account-id={account.accountId}
                                            data-connection-id={account.connectionId} onclick={handleSendTransferRT}
                                            title="Send transfer to external account via routing/account number">
                                            Send Transfer via RT
                                        </button>

                                        <button class="get-auth-btn" data-account-id={account.accountId}
                                            data-connection-id={account.connectionId} onclick={handleGetAuth}>
                                            <template if:true={isLoadingAuth}>...</template>
                                            <template if:false={isLoadingAuth}>Get Auth</template>
                                        </button>

                                        <button class="view-txn-btn" data-group-key={connection.groupKey}
                                            data-account-id={account.accountId}
                                            data-connection-id={account.connectionId} onclick={handleViewTransactions}
                                            title="View transaction history for this account">
                                            Transactions
                                        </button>

                                        <template if:false={account.confirmingDelete}>
                                            <button class="trash-btn" data-group-key={connection.groupKey}
                                                data-account-id={account.accountId} onclick={handleDeleteClick}>
                                                <lightning-icon icon-name="utility:delete" size="x-small">
                                                </lightning-icon>
                                            </button>
                                        </template>
                                        <template if:true={account.confirmingDelete}>
                                            <div class="delete-confirm">
                                                <span class="confirm-label">Remove?</span>
                                                <button class="confirm-yes" data-group-key={connection.groupKey}
                                                    data-account-id={account.accountId}
                                                    onclick={handleConfirmDelete}>✓</button>
                                                <button class="confirm-no" data-group-key={connection.groupKey}
                                                    data-account-id={account.accountId}
                                                    onclick={handleCancelDelete}>✕</button>
                                            </div>
                                        </template>
                                    </div>

                                </div>
                            </template>
                        </div>

                    </div>
                </template>

                <!-- ── Transfer Modal ──────────────────────────────────── -->
                <template if:true={isTransferModalOpen}>
                    <div class="acct-modal-backdrop" onclick={handleCloseTransferModal}></div>
                    <div class="acct-modal transfer-modal" role="dialog" aria-modal="true" aria-label="Send Transfer">

                        <!-- Header -->
                        <div class="acct-modal-header transfer-modal-header">
                            <div class="acct-modal-header-left">
                                <div class="transfer-modal-icon">
                                    <lightning-icon icon-name="utility:forward" size="small" variant="inverse"></lightning-icon>
                                </div>
                                <div>
                                    <h2 class="acct-modal-title">Send Transfer</h2>
                                    <p class="acct-modal-subtitle">Debit from source · Credit to destination</p>
                                </div>
                            </div>
                            <button class="acct-modal-close" onclick={handleCloseTransferModal}>✕</button>
                        </div>

                        <!-- Body -->
                        <div class="acct-modal-body">

                            <!-- FROM: Source account banner -->
                            <div class="transfer-source-banner">
                                <div class="transfer-source-icon">
                                    <lightning-icon icon-name={transferSourceAccount.iconName} size="x-small" variant="inverse"></lightning-icon>
                                </div>
                                <div class="transfer-source-info">
                                    <span class="transfer-source-label">From — Debit (money leaves this account)</span>
                                    <span class="transfer-source-name">{transferSourceAccount.institutionName} · {transferSourceAccount.name} ••••{transferSourceAccount.mask}</span>
                                    <template if:true={sourceLegalName}>
                                        <span class="transfer-source-sub">{sourceLegalName}</span>
                                    </template>
                                </div>
                            </div>

                            <!-- TO: Destination account selector -->
                            <div class="acct-modal-section">
                                <h3 class="acct-modal-section-title">To Account (Destination)</h3>

                                <template if:true={hasDestinationAccounts}>
                                    <div class="transfer-dest-select-wrap">
                                        <label class="transfer-label">Select Bank Account <span class="transfer-required">*</span></label>
                                        <select class="transfer-select transfer-select-dest" onchange={handleDestAccountChange}>
                                            <option value="">-- Select Destination Account --</option>
                                            <template for:each={destinationAccounts} for:item="opt">
                                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                                            </template>
                                        </select>
                                    </div>
                                </template>
                                <template if:false={hasDestinationAccounts}>
                                    <p class="transfer-no-dest">No other linked accounts available. Connect another bank to send a transfer.</p>
                                </template>

                                <!-- Selected destination info card -->
                                <template if:true={selectedDestAccount}>
                                    <div class="transfer-dest-banner">
                                        <div class="transfer-dest-icon">
                                            <lightning-icon icon-name={selectedDestAccount.iconName} size="x-small" variant="inverse"></lightning-icon>
                                        </div>
                                        <div class="transfer-dest-info">
                                            <span class="transfer-dest-label">To — Credit (money arrives here)</span>
                                            <span class="transfer-dest-name">{selectedDestAccount.institutionName} · {selectedDestAccount.name} ••••{selectedDestAccount.mask}</span>
                                            <template if:true={destLegalName}>
                                                <span class="transfer-dest-sub">{destLegalName}</span>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Transfer Details -->
                            <div class="acct-modal-section">
                                <h3 class="acct-modal-section-title">Transfer Details</h3>
                                <div class="transfer-params-grid">
                                    <div class="transfer-row-field">
                                        <label class="transfer-label">Amount ($) <span class="transfer-required">*</span></label>
                                        <input type="number" class="transfer-input" data-field="transferAmount"
                                            onchange={handleTransferFieldChange} placeholder="0.00" min="0.01" step="0.01" />
                                    </div>
                                    <div class="transfer-row-field">
                                        <label class="transfer-label">Network</label>
                                        <select class="transfer-select" data-field="transferNetwork" onchange={handleTransferFieldChange}>
                                            <option value="ach">ACH – Standard (1-3 days)</option>
                                            <option value="same-day-ach">Same-Day ACH</option>
                                            <option value="rtp">RTP – Real-Time</option>
                                        </select>
                                    </div>
                                    <div class="transfer-row-field">
                                        <label class="transfer-label">ACH Class</label>
                                        <select class="transfer-select" data-field="transferAchClass" onchange={handleTransferFieldChange}>
                                            <option value="ppd">PPD – Personal</option>
                                            <option value="ccd">CCD – Corporate</option>
                                            <option value="web">WEB – Internet</option>
                                            <option value="tel">TEL – Telephone</option>
                                        </select>
                                    </div>
                                    <div class="transfer-row-field">
                                        <label class="transfer-label">Description <span class="transfer-hint">(max 10 chars)</span></label>
                                        <input type="text" class="transfer-input" data-field="transferDescription"
                                            onchange={handleTransferFieldChange} placeholder="e.g. Payment" maxlength="10" />
                                    </div>
                                </div>
                            </div>

                            <!-- Result -->
                            <template if:true={hasTransferResult}>
                                <div class="acct-modal-section">
                                    <h3 class="acct-modal-section-title">Transfer Result</h3>
                                    <template if:true={transferResult.success}>
                                        <div class="transfer-result-success">
                                            <lightning-icon icon-name="utility:success" size="x-small" variant="success"></lightning-icon>
                                            <div class="transfer-result-info">
                                                <span class="transfer-result-label">{transferResult.label}</span>
                                                <span class="transfer-result-meta">Debit ID: {transferResult.debitTransferId} · Status: {transferResult.debitStatus}</span>
                                                <span class="transfer-result-meta">Credit ID: {transferResult.creditTransferId} · Status: {transferResult.creditStatus}</span>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:false={transferResult.success}>
                                        <div class="transfer-result-failure">
                                            <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                                            <div class="transfer-result-info">
                                                <span class="transfer-result-label">Transfer Failed</span>
                                                <span class="transfer-result-error">{transferResult.error}</span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                        </div>

                        <!-- Footer -->
                        <div class="acct-modal-footer">
                            <button class="acct-modal-footer-btn" onclick={handleCloseTransferModal}>Close</button>
                            <button class="transfer-submit-btn" onclick={handleSubmitTransfer} disabled={isSubmittingTransfer}>
                                <template if:true={isSubmittingTransfer}>Sending...</template>
                                <template if:false={isSubmittingTransfer}>Send Transfer</template>
                            </button>
                        </div>
                    </div>
                </template>

                <!-- ── Transactions Modal ──────────────────────────────── -->
                <template if:true={isTransactionsModalOpen}>
                    <div class="acct-modal-backdrop" onclick={handleCloseTransactionsModal}></div>
                    <div class="acct-modal txn-modal" role="dialog" aria-modal="true" aria-label="Transactions">

                        <!-- Header -->
                        <div class="acct-modal-header txn-modal-header">
                            <div class="acct-modal-header-left">
                                <div class="txn-modal-icon">
                                    <lightning-icon icon-name="utility:list" size="small" variant="inverse"></lightning-icon>
                                </div>
                                <div>
                                    <h2 class="acct-modal-title">{transactionSourceAccount.institutionName} · {transactionSourceAccount.name}</h2>
                                    <p class="acct-modal-subtitle">Transaction History ••••{transactionSourceAccount.mask}</p>
                                </div>
                            </div>
                            <button class="acct-modal-close" onclick={handleCloseTransactionsModal}>✕</button>
                        </div>

                        <!-- Body -->
                        <div class="acct-modal-body">
                            <template if:true={isLoadingTransactions}>
                                <div class="loading-container">
                                    <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
                                </div>
                            </template>
                            <template if:false={isLoadingTransactions}>
                                <template if:true={hasTransactions}>
                                    <div class="txn-list-header">
                                        <span>Date</span>
                                        <span>Description</span>
                                        <span class="txn-amount-col">Amount</span>
                                    </div>
                                    <div class="txn-list">
                                        <template for:each={transactions} for:item="txn">
                                            <div key={txn.key} class="txn-row">
                                                <span class="txn-date">{txn.date}</span>
                                                <span class="txn-name">{txn.name}</span>
                                                <span class={txn.amountClass}>{txn.formattedAmt}</span>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template if:true={noTransactions}>
                                    <div class="txn-empty">
                                        <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                        <p>No transactions found for this account.</p>
                                    </div>
                                </template>
                            </template>
                        </div>

                        <!-- Footer -->
                        <div class="acct-modal-footer">
                            <button class="acct-modal-footer-btn" onclick={handleCloseTransactionsModal}>Close</button>
                        </div>
                    </div>
                </template>

                <!-- ── Auth Modal ────────────────────────────────── -->
                <template if:true={hasAuthData}>
                    <div class="acct-modal-backdrop" onclick={handleCloseAuthModal}></div>
                    <div class="acct-modal auth-modal" role="dialog" aria-modal="true" aria-label="Account Auth">

                        <div class="acct-modal-header auth-modal-header">
                            <div class="acct-modal-header-left">
                                <div class="auth-modal-icon">
                                    <lightning-icon icon-name="utility:key" size="small" variant="inverse"></lightning-icon>
                                </div>
                                <div>
                                    <h2 class="acct-modal-title">{authData.accountName}</h2>
                                    <p class="acct-modal-subtitle">Routing &amp; Account Numbers</p>
                                </div>
                            </div>
                            <button class="acct-modal-close" onclick={handleCloseAuthModal}>✕</button>
                        </div>

                        <div class="acct-modal-body">
                            <template if:true={authData.ach}>
                                <div class="acct-modal-section">
                                    <h3 class="acct-modal-section-title">ACH — US Automated Clearing House</h3>
                                    <div class="auth-numbers-grid">
                                        <div class="auth-number-card">
                                            <span class="auth-number-label">Account Number</span>
                                            <span class="auth-number-value auth-mono">{authData.ach.account}</span>
                                        </div>
                                        <div class="auth-number-card">
                                            <span class="auth-number-label">Routing Number</span>
                                            <span class="auth-number-value auth-mono">{authData.ach.routing}</span>
                                        </div>
                                        <template if:true={authData.ach.wireRouting}>
                                            <div class="auth-number-card">
                                                <span class="auth-number-label">Wire Routing Number</span>
                                                <span class="auth-number-value auth-mono">{authData.ach.wireRouting}</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template if:true={authData.eft}>
                                <div class="acct-modal-section">
                                    <h3 class="acct-modal-section-title">EFT — Canadian Electronic Funds Transfer</h3>
                                    <div class="auth-numbers-grid">
                                        <div class="auth-number-card">
                                            <span class="auth-number-label">Account Number</span>
                                            <span class="auth-number-value auth-mono">{authData.eft.account}</span>
                                        </div>
                                        <div class="auth-number-card">
                                            <span class="auth-number-label">Institution Number</span>
                                            <span class="auth-number-value auth-mono">{authData.eft.institution}</span>
                                        </div>
                                        <div class="auth-number-card">
                                            <span class="auth-number-label">Branch / Transit Number</span>
                                            <span class="auth-number-value auth-mono">{authData.eft.branch}</span>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <template if:true={authData.international}>
                                <div class="acct-modal-section">
                                    <h3 class="acct-modal-section-title">International</h3>
                                    <div class="auth-numbers-grid">
                                        <template if:true={authData.international.iban}>
                                            <div class="auth-number-card auth-number-card--wide">
                                                <span class="auth-number-label">IBAN</span>
                                                <span class="auth-number-value auth-mono">{authData.international.iban}</span>
                                            </div>
                                        </template>
                                        <template if:true={authData.international.bic}>
                                            <div class="auth-number-card">
                                                <span class="auth-number-label">BIC / SWIFT</span>
                                                <span class="auth-number-value auth-mono">{authData.international.bic}</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template if:true={authData.bacs}>
                                <div class="acct-modal-section">
                                    <h3 class="acct-modal-section-title">BACS — UK Bankers' Automated Clearing Services</h3>
                                    <div class="auth-numbers-grid">
                                        <div class="auth-number-card">
                                            <span class="auth-number-label">Account Number</span>
                                            <span class="auth-number-value auth-mono">{authData.bacs.account}</span>
                                        </div>
                                        <div class="auth-number-card">
                                            <span class="auth-number-label">Sort Code</span>
                                            <span class="auth-number-value auth-mono">{authData.bacs.sortCode}</span>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <template if:false={authData.ach}>
                                <template if:false={authData.eft}>
                                    <template if:false={authData.international}>
                                        <template if:false={authData.bacs}>
                                            <div class="auth-empty">
                                                <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                                <p>No routing numbers available for this account.</p>
                                            </div>
                                        </template>
                                    </template>
                                </template>
                            </template>
                        </div>

                        <div class="acct-modal-footer">
                            <button class="acct-modal-footer-btn" onclick={handleCloseAuthModal}>Close</button>
                        </div>
                    </div>
                </template>

                <!-- ── Identity Modal ────────────────────────────── -->
                <template if:true={hasIdentityData}>
                    <div class="acct-modal-backdrop" onclick={handleCloseIdentityModal}></div>
                    <div class="acct-modal id-modal" role="dialog" aria-modal="true" aria-label="Account Identity">

                        <div class="acct-modal-header id-modal-header">
                            <div class="acct-modal-header-left">
                                <div class="id-modal-icon">
                                    <lightning-icon icon-name="utility:contact" size="small" variant="inverse"></lightning-icon>
                                </div>
                                <div>
                                    <h2 class="acct-modal-title">{identityData.accountName}</h2>
                                    <p class="acct-modal-subtitle">Identity &amp; Ownership Details</p>
                                </div>
                            </div>
                            <button class="acct-modal-close" onclick={handleCloseIdentityModal}>✕</button>
                        </div>

                        <div class="acct-modal-body">
                            <template for:each={identityData.owners} for:item="owner">
                                <div key={owner.ownerKey} class="id-owner-block">

                                    <div class="acct-modal-section">
                                        <h3 class="acct-modal-section-title">Owner Name(s)</h3>
                                        <template for:each={owner.names} for:item="nameItem">
                                            <div key={nameItem.key} class="id-name-row">{nameItem.value}</div>
                                        </template>
                                    </div>

                                    <template if:true={owner.emails.length}>
                                        <div class="acct-modal-section">
                                            <h3 class="acct-modal-section-title">Email Addresses</h3>
                                            <div class="id-contact-grid">
                                                <template for:each={owner.emails} for:item="email">
                                                    <div key={email.key} class="id-contact-card">
                                                        <div class="id-contact-icon id-contact-icon--email">
                                                            <lightning-icon icon-name="utility:email" size="x-small" variant="inverse"></lightning-icon>
                                                        </div>
                                                        <div class="id-contact-info">
                                                            <span class="id-contact-value">{email.data}</span>
                                                            <span class="id-contact-meta">{email.type}</span>
                                                        </div>
                                                        <template if:true={email.primary}>
                                                            <span class="id-primary-badge">Primary</span>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>

                                    <template if:true={owner.phones.length}>
                                        <div class="acct-modal-section">
                                            <h3 class="acct-modal-section-title">Phone Numbers</h3>
                                            <div class="id-contact-grid">
                                                <template for:each={owner.phones} for:item="phone">
                                                    <div key={phone.key} class="id-contact-card">
                                                        <div class="id-contact-icon id-contact-icon--phone">
                                                            <lightning-icon icon-name="utility:call" size="x-small" variant="inverse"></lightning-icon>
                                                        </div>
                                                        <div class="id-contact-info">
                                                            <span class="id-contact-value">{phone.data}</span>
                                                            <span class="id-contact-meta">{phone.type}</span>
                                                        </div>
                                                        <template if:true={phone.primary}>
                                                            <span class="id-primary-badge">Primary</span>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>

                                    <template if:true={owner.addresses.length}>
                                        <div class="acct-modal-section">
                                            <h3 class="acct-modal-section-title">Addresses</h3>
                                            <div class="id-address-list">
                                                <template for:each={owner.addresses} for:item="addr">
                                                    <div key={addr.key} class="id-address-card">
                                                        <div class="id-address-icon">
                                                            <lightning-icon icon-name="utility:location" size="x-small" variant="inverse"></lightning-icon>
                                                        </div>
                                                        <div class="id-address-info">
                                                            <template if:true={addr.street}>
                                                                <span class="id-address-street">{addr.street}</span>
                                                            </template>
                                                            <span class="id-address-line">
                                                                {addr.city}<template if:true={addr.region}>, {addr.region}</template>
                                                                <template if:true={addr.postalCode}> {addr.postalCode}</template>
                                                            </span>
                                                            <template if:true={addr.country}>
                                                                <span class="id-address-country">{addr.country}</span>
                                                            </template>
                                                        </div>
                                                        <template if:true={addr.primary}>
                                                            <span class="id-primary-badge">Primary</span>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>

                                </div>
                            </template>
                        </div>

                        <div class="acct-modal-footer">
                            <button class="acct-modal-footer-btn" onclick={handleCloseIdentityModal}>Close</button>
                        </div>
                    </div>
                </template>

                <!-- ── RT Transfer Modal (migrate_account flow) ──────── -->
                <template if:true={isRTTransferModalOpen}>
                    <div class="acct-modal-backdrop" onclick={handleCloseRTTransferModal}></div>
                    <div class="acct-modal rt-transfer-modal" role="dialog" aria-modal="true" aria-label="Send Transfer via RT">

                        <!-- Header -->
                        <div class="acct-modal-header rt-transfer-modal-header">
                            <div class="acct-modal-header-left">
                                <div class="rt-transfer-modal-icon">
                                    <lightning-icon icon-name="utility:routing_offline" size="small" variant="inverse"></lightning-icon>
                                </div>
                                <div>
                                    <h2 class="acct-modal-title">Send Transfer via RT</h2>
                                    <p class="acct-modal-subtitle">Debit from {rtTransferSourceAccount.institutionName} · {rtTransferSourceAccount.name} ••••{rtTransferSourceAccount.mask}</p>
                                </div>
                            </div>
                            <button class="acct-modal-close" onclick={handleCloseRTTransferModal}>✕</button>
                        </div>

                        <!-- Body -->
                        <div class="acct-modal-body">

                            <!-- Recipient details -->
                            <div class="acct-modal-section">
                                <h3 class="acct-modal-section-title">Recipient Bank Details</h3>
                                <div class="transfer-params-grid">
                                    <div class="transfer-row-field">
                                        <label class="transfer-label">Account Number <span class="transfer-required">*</span></label>
                                        <input type="text" class="transfer-input" data-field="rtRecipientAccountNumber"
                                            onchange={handleRTTransferFieldChange} placeholder="e.g. 100000000" />
                                    </div>
                                    <div class="transfer-row-field">
                                        <label class="transfer-label">Routing Number <span class="transfer-required">*</span></label>
                                        <input type="text" class="transfer-input" data-field="rtRecipientRoutingNumber"
                                            onchange={handleRTTransferFieldChange} placeholder="e.g. 121122676" />
                                    </div>
                                    <div class="transfer-row-field">
                                        <label class="transfer-label">Account Type <span class="transfer-required">*</span></label>
                                        <select class="transfer-select" data-field="rtRecipientAccountType" onchange={handleRTTransferFieldChange}>
                                            <option value="checking">Checking</option>
                                            <option value="savings">Savings</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- Transfer details -->
                            <div class="acct-modal-section">
                                <h3 class="acct-modal-section-title">Transfer Details</h3>
                                <div class="transfer-params-grid">
                                    <div class="transfer-row-field">
                                        <label class="transfer-label">Amount ($) <span class="transfer-required">*</span></label>
                                        <input type="number" class="transfer-input" data-field="rtTransferAmount"
                                            onchange={handleRTTransferFieldChange} placeholder="0.00" min="0.01" step="0.01" />
                                    </div>
                                    <div class="transfer-row-field">
                                        <label class="transfer-label">Network</label>
                                        <select class="transfer-select" data-field="rtTransferNetwork" onchange={handleRTTransferFieldChange}>
                                            <option value="ach">ACH – Standard (1-3 days)</option>
                                            <option value="same-day-ach">Same-Day ACH</option>
                                            <option value="rtp">RTP – Real-Time</option>
                                        </select>
                                    </div>
                                    <div class="transfer-row-field">
                                        <label class="transfer-label">ACH Class (sender)</label>
                                        <select class="transfer-select" data-field="rtTransferAchClass" onchange={handleRTTransferFieldChange}>
                                            <option value="web">WEB – Internet (default)</option>
                                            <option value="ccd">CCD – Corporate</option>
                                            <option value="tel">TEL – Telephone</option>
                                        </select>
                                    </div>
                                    <div class="transfer-row-field">
                                        <label class="transfer-label">Description <span class="transfer-hint">(max 10 chars)</span></label>
                                        <input type="text" class="transfer-input" data-field="rtTransferDescription"
                                            onchange={handleRTTransferFieldChange} placeholder="e.g. Payment" maxlength="10" />
                                    </div>
                                </div>
                            </div>

                            <!-- Result -->
                            <template if:true={hasRTTransferResult}>
                                <div class="acct-modal-section">
                                    <h3 class="acct-modal-section-title">Transfer Result</h3>
                                    <template if:true={rtTransferResult.success}>
                                        <div class="transfer-result-success">
                                            <lightning-icon icon-name="utility:success" size="x-small" variant="success"></lightning-icon>
                                            <div class="transfer-result-info">
                                                <span class="transfer-result-label">{rtTransferResult.label}</span>
                                                <span class="transfer-result-meta">Debit ID: {rtTransferResult.debitTransferId} · Status: {rtTransferResult.debitStatus}</span>
                                                <span class="transfer-result-meta">Credit ID: {rtTransferResult.creditTransferId} · Status: {rtTransferResult.creditStatus}</span>
                                                <span class="transfer-result-meta">Recipient Access Token: {rtTransferResult.destAccessToken}</span>
                                                <span class="transfer-result-meta">Recipient Account ID: {rtTransferResult.destAccountId}</span>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:false={rtTransferResult.success}>
                                        <div class="transfer-result-failure">
                                            <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                                            <div class="transfer-result-info">
                                                <span class="transfer-result-label">Transfer Failed</span>
                                                <span class="transfer-result-error">{rtTransferResult.error}</span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                        </div>

                        <!-- Footer -->
                        <div class="acct-modal-footer">
                            <button class="acct-modal-footer-btn" onclick={handleCloseRTTransferModal}>Close</button>
                            <button class="transfer-submit-btn" onclick={handleSubmitRTTransfer} disabled={isSubmittingRTTransfer}>
                                <template if:true={isSubmittingRTTransfer}>Processing...</template>
                                <template if:false={isSubmittingRTTransfer}>Send Transfer</template>
                            </button>
                        </div>
                    </div>
                </template>

                <!-- ── Account Detail Modal ───────────────────────── -->
                <template if:true={hasSelectedAccount}>
                    <div class="acct-modal-backdrop" onclick={handleCloseModal}></div>
                    <div class="acct-modal" role="dialog" aria-modal="true" aria-label="Account Details">

                        <div class="acct-modal-header">
                            <div class="acct-modal-header-left">
                                <div class="acct-modal-icon" style={selectedAccount.iconStyle}>
                                    <lightning-icon icon-name={selectedAccount.iconName} size="small" variant="inverse"></lightning-icon>
                                </div>
                                <div>
                                    <h2 class="acct-modal-title">{selectedAccount.name}</h2>
                                    <template if:true={selectedAccount.officialName}>
                                        <p class="acct-modal-subtitle">{selectedAccount.officialName}</p>
                                    </template>
                                    <span class={selectedAccount.chipClass}>{selectedAccount.subtype}</span>
                                </div>
                            </div>
                            <button class="acct-modal-close" onclick={handleCloseModal}>✕</button>
                        </div>

                        <div class="acct-modal-body">
                            <div class="acct-modal-section">
                                <h3 class="acct-modal-section-title">Account Information</h3>
                                <div class="acct-modal-grid">
                                    <div class="acct-modal-field">
                                        <span class="acct-modal-label">Account ID</span>
                                        <span class="acct-modal-value acct-modal-mono">{selectedAccount.accountId}</span>
                                    </div>
                                    <div class="acct-modal-field">
                                        <span class="acct-modal-label">Account Name</span>
                                        <span class="acct-modal-value">{selectedAccount.name}</span>
                                    </div>
                                    <template if:true={selectedAccount.officialName}>
                                        <div class="acct-modal-field">
                                            <span class="acct-modal-label">Official Name</span>
                                            <span class="acct-modal-value">{selectedAccount.officialName}</span>
                                        </div>
                                    </template>
                                    <div class="acct-modal-field">
                                        <span class="acct-modal-label">Account Type</span>
                                        <span class="acct-modal-value acct-modal-capitalize">{selectedAccount.type}</span>
                                    </div>
                                    <div class="acct-modal-field">
                                        <span class="acct-modal-label">Subtype</span>
                                        <span class="acct-modal-value acct-modal-capitalize">{selectedAccount.subtype}</span>
                                    </div>
                                    <div class="acct-modal-field">
                                        <span class="acct-modal-label">Account Mask</span>
                                        <span class="acct-modal-value">••••{selectedAccount.mask}</span>
                                    </div>
                                    <div class="acct-modal-field">
                                        <span class="acct-modal-label">Currency</span>
                                        <span class="acct-modal-value">{selectedAccount.currencyCode}</span>
                                    </div>
                                    <template if:true={selectedAccount.verificationStatus}>
                                        <div class="acct-modal-field">
                                            <span class="acct-modal-label">Verification Status</span>
                                            <span class="acct-modal-value acct-modal-capitalize">{selectedAccount.verificationStatus}</span>
                                        </div>
                                    </template>
                                    <template if:true={selectedAccount.persistentAccountId}>
                                        <div class="acct-modal-field acct-modal-field--full">
                                            <span class="acct-modal-label">Persistent Account ID</span>
                                            <span class="acct-modal-value acct-modal-mono">{selectedAccount.persistentAccountId}</span>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <div class="acct-modal-section">
                                <h3 class="acct-modal-section-title">Balances</h3>
                                <div class="acct-modal-balance-grid">
                                    <div class="acct-modal-balance-card acct-modal-balance-card--current">
                                        <span class="acct-modal-balance-label">Current Balance</span>
                                        <span class="acct-modal-balance-amount">{selectedAccount.formattedCurrentBalance}</span>
                                    </div>
                                    <div class="acct-modal-balance-card acct-modal-balance-card--available">
                                        <span class="acct-modal-balance-label">Available Balance</span>
                                        <span class="acct-modal-balance-amount">{selectedAccount.formattedAvailableBalance}</span>
                                    </div>
                                    <div class="acct-modal-balance-card acct-modal-balance-card--limit">
                                        <span class="acct-modal-balance-label">Credit / Loan Limit</span>
                                        <span class="acct-modal-balance-amount">{selectedAccount.formattedLimitBalance}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="acct-modal-footer">
                            <button class="acct-modal-footer-btn" onclick={handleCloseModal}>Close</button>
                        </div>
                    </div>
                </template>

            </template>
        </div>
    </lightning-card>
</template>
